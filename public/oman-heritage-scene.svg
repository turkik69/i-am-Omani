 <linearGradient id="sand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d99b54"/><stop offset="1" stop-color="#8b4b32"/></linearGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
 <filter id="gold"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#ffbf58" flood-opacity=".28"/></filter>
</defs>
